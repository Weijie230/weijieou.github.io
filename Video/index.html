<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Embed Assignment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #222;
      margin-bottom: 40px;
    }

    .video-section {
      background-color: white;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h2 {
      color: #333;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
      color: #555;
    }

    iframe {
      width: 100%;
      max-width: 800px;
      height: 450px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Embedded YouTube Videos</h1>

  <div class="video-section">
    <h2>Video 1</h2>

    <iframe width="560" height="315"
      src="https://www.youtube.com/embed/0e3GPea1Tyg?si=_OEPKqthCwe3878o"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

   
  </div>

  <div class="video-section">
    <h2>Video 2</h2>

    <iframe width="560" height="315"
      src="https://www.youtube.com/embed/sR1hzqn8k5w?si=-SCaS9oJP4xQENrR"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

   
  </div>

  <div class="video-section">
    <h2>Video 3</h2>

    <iframe width="560" height="315"
      src="https://www.youtube.com/embed/4oBpaBEMBIM?si=1uUTT-ylvDTvmRKa"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

   
  </div>

</body>
</html>
